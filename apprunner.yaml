version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - corepack enable
      - pnpm install --frozen-lockfile
run:
  runtime-version: 22
  command: node server/index.js
  network:
    port: 4000
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "4000"
    - name: STORAGE_DRIVER
      value: aws
